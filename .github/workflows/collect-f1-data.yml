name: Coleta diária de F1

on:
  schedule:
    # 09:00 UTC = 06:00 em Brasília (UTC-3). O GitHub pode atrasar alguns minutos.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      migrate_only:
        description: "Aplicar apenas as migrações do banco"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: collect-f1-data
  cancel-in-progress: false

jobs:
  collect:
    name: Coletar notícias e dados
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Verificar segredo DATABASE_URL
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Cadastre o segredo DATABASE_URL em Settings > Secrets and variables > Actions."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar pipeline
        run: |
          if [ "${{ inputs.migrate_only }}" = "true" ]; then
            python -m pipeline --migrate-only
          else
            python -m pipeline
          fi
